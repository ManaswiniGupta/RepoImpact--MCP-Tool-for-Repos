[project]
name = "repoimpact"
version = "0.1.0"
description = "Structural change-impact analysis for Python repositories, exposed via MCP."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "streamlit>=1.35.0",
    "google-genai==2.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repoimpact*"]
